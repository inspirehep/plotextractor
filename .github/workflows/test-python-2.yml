name: Test Python 2

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: sudo apt-get update -y && sudo apt-get install -y ghostscript poppler-utils python2

      - name: Fix ImageMagick GhostScript permissions
        run: |
          sudo sed -i 's/domain="coder" rights="none"/domain="coder" rights="read\|write"/' /etc/ImageMagick-6/policy.xml

      - name: Install python dependencies
        run: |
          wget https://bootstrap.pypa.io/pip/2.7/get-pip.py
          python2 get-pip.py
          python2 -m pip install --user --upgrade pip
          python2 -m pip --no-cache-dir install --user -e .[tests]

      - name: Show python dependencies
        run: |
          python2 --version
          pip freeze

      - name: Run tests
        run: |
            pytest tests
